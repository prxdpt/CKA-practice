apiVersion: v1
kind: Pod
metadata:
  name: applet-pod
  labels:
    app: applet
spec:
  containers:
  - name: applet-container
    # Replace the image below with your actual built Docker image
    # For example: prxdpt/applet-docker:latest
    image: applet-docker:latest 
    ports:
    - containerPort: 80
